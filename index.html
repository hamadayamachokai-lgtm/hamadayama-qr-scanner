<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>浜田山町会 QRスキャナー</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#102441;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{max-width:660px;margin:0 auto;padding:20px 15px 45px}header{background:#102441;color:#fff;border-radius:18px;padding:22px}header small{color:#e6bc49;font-weight:800;letter-spacing:.1em}h1{font-size:23px;margin:7px 0 0}.card{background:white;border:1px solid #dae0e8;border-radius:16px;padding:18px;margin-top:14px}h2{font-size:18px;margin:0 0 12px}.btn{width:100%;border:0;border-radius:11px;padding:16px;margin:6px 0;font-size:17px;font-weight:800;cursor:pointer;background:#102441;color:#fff}.btn.alt{background:#eaf1f9;color:#102441}.btn.stop{background:#a72d43}.btn:disabled{opacity:.5}.muted{color:#617085;font-size:13px;line-height:1.65}.camera{position:relative;background:#101923;border-radius:12px;overflow:hidden;min-height:180px;display:none}.camera video{display:block;width:100%;max-height:430px;object-fit:cover}.camera:after{content:"";position:absolute;left:18%;right:18%;top:18%;bottom:18%;border:3px solid #e6bc49;border-radius:14px;pointer-events:none}#status{font-size:14px;line-height:1.7;white-space:pre-wrap}#result{word-break:break-all;font-weight:700;background:#f2f5fa;padding:12px;border-radius:10px;min-height:48px}input[type=file]{display:none}canvas{display:none}.warn{color:#a52b3c} .success{color:#176d43}.field{display:block;width:100%;margin:8px 0 14px;padding:13px;border:1px solid #9ba8ba;border-radius:9px;font-size:16px}.modes{display:grid;grid-template-columns:1fr;gap:5px}.mode.selected{background:#102441;color:white}#chosen{font-weight:700;margin-top:10px}.detail{line-height:1.8}.detail .notice{background:#f3f6fb;padding:13px;border-radius:10px;margin-top:10px}.detail .good{background:#ecf8f1}.detail .bad{background:#fff0f0}.detail .qty{font-size:32px;font-weight:900}.detail .accept{background:#17744b}#searchResults .item{border-top:1px solid #dae0e8;padding:12px 0}.small{font-size:13px;color:#617085} </style></head>
<body><div class="wrap"><header><small>HAMADAYAMA TOWN ASSOCIATION</small><h1>浜田山町会 QRスキャナー</h1></header>
<section class="card"><h2>📷 QR連続読み取り Ver1.3・受付連携</h2><p class="muted">受付モードを選択してからカメラを起動してください。QRを読み取ると照合して受信端末に送信します。受付の確定は受信端末で行います。</p><div class="camera" id="camera"><video id="video" autoplay muted playsinline></video></div><button class="btn" id="start">📷 カメラを起動</button><button class="btn stop" id="stop" hidden>■ カメラを停止</button><button class="btn alt" id="photo">📸 写真を撮影・選択して読み取る</button><input type="file" id="file" accept="image/*" capture="environment"><p id="status" aria-live="polite">待機中</p></section>
<section class="card"><h2>① 受付担当者の設定</h2><label class="muted" for="endpoint">GASウェブアプリURL（/exec）</label><input id="endpoint" class="field" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"><label class="muted" for="secret">受付担当者用の認証キー</label><input id="secret" class="field" type="password" autocomplete="off" placeholder="GASの設定関数で発行されたキー"><p class="muted">認証キーはGitHubのHTMLに保存しません。この画面を閉じると再入力が必要です。</p></section>
<section class="card"><h2>② モードを選択</h2><div class="modes"><button class="btn alt mode" data-mode="festival">🍬 祭礼菓子配布</button><button class="btn alt mode" data-mode="entertainment">🎁 演芸会お土産</button><button class="btn alt mode" data-mode="disaster">🚨 災害時会員確認</button></div><div id="chosen">モード未選択</div></section>
<section class="card"><h2>③ QR照合・受信端末へ送信</h2><div id="result">まだ読み取っていません</div><button class="btn alt" id="copy" disabled>QR内容をコピー</button><button class="btn" id="checkQr" disabled>読み取ったQRを再照合</button><div id="detail" class="detail"></div></section>
<section class="card"><h2>🔍 手動テキストで検索</h2><p class="muted">QRを忘れた方は会員番号・氏名・住所の一部で検索します。</p><input id="manual" class="field" placeholder="会員番号・氏名・住所" autocomplete="off"><button class="btn alt" id="search">検索する</button><div id="searchResults"></div></section>
<iframe id="bridgeFrame" name="hmtBridgeFrame" hidden title="受付通信"></iframe><form id="bridgeForm" method="POST" target="hmtBridgeFrame" hidden><input name="hmtQrBridge" value="v22"><input name="nonce"><input name="secret"><input name="op"><input name="mode"><input name="payload"></form>
<canvas id="canvas"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(()=>{'use strict';
const video=document.getElementById('video'),box=document.getElementById('camera'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),status=document.getElementById('status'),result=document.getElementById('result'),start=document.getElementById('start'),stop=document.getElementById('stop'),file=document.getElementById('file');
let stream=null,raf=0,last='',lastAt=0,scanning=false,lastFrame=0,frames=0,nativeDetector=null,busy=false;
 let mode='',lastQr='',inFlight=false,pending=null; const detail=document.getElementById('detail');
function say(s,kind=''){status.textContent=s;status.className=kind;}
function detected(s){const now=Date.now();if(s===last&&now-lastAt<2500)return;last=s;lastAt=now;result.textContent=s;document.getElementById('copy').disabled=false;say('QRを読み取りました。続けて次のQRを読み取れます。','success');if(navigator.vibrate)navigator.vibrate(100);lastQr=s;request('check',s);}
function decode(){if(!window.jsQR){say('QR解析ライブラリを読み込めません。インターネット接続を確認してください。','warn');return false;}try{const found=window.jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(found){detected(found.data);return true;}}catch(e){say('画像解析に失敗しました: '+e.message,'warn');}return false;}
async function inspectFrame(){
 if(busy||!scanning||video.readyState<2||!video.videoWidth)return;
 busy=true;
 try{
  if(nativeDetector){
   try{const codes=await nativeDetector.detect(video);if(codes.length&&codes[0].rawValue){detected(codes[0].rawValue);return;}}catch(e){nativeDetector=null;}
  }
  // Decode the center region first. Lower resolution prevents Safari UI freezes.
  const vw=video.videoWidth,vh=video.videoHeight;
  const regions=[{x:vw*.13,y:vh*.13,w:vw*.74,h:vh*.74,max:720},{x:0,y:0,w:vw,h:vh,max:640}];
  for(const r of regions){
   const scale=Math.min(1,r.max/Math.max(r.w,r.h));
   canvas.width=Math.max(1,Math.round(r.w*scale));canvas.height=Math.max(1,Math.round(r.h*scale));
   ctx.drawImage(video,r.x,r.y,r.w,r.h,0,0,canvas.width,canvas.height);
   if(decode())return;
  }
  frames++;
  if(frames%10===0)say('自動解析中（'+frames+'回）。QR全体を枠の中央に入れ、画面から少し離してピントを合わせてください。');
 }catch(e){say('解析エラー: '+e.message,'warn');}finally{busy=false;}
}
function frame(t){
 if(!scanning)return;
 if(t-lastFrame>=350){lastFrame=t;inspectFrame();}
 raf=requestAnimationFrame(frame);
}
function halt(){scanning=false;busy=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;box.style.display='none';start.hidden=false;stop.hidden=true;}
start.addEventListener('click',async()=>{if(!navigator.mediaDevices?.getUserMedia){say('このブラウザではカメラを利用できません。SafariのHTTPSページで開くか写真読取をご利用ください。','warn');return;}if(!window.jsQR){say('QR解析ライブラリを読み込めません。通信状態を確認してください。','warn');return;}try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},focusMode:{ideal:"continuous"}}});video.srcObject=stream;await video.play();box.style.display='block';start.hidden=true;stop.hidden=false;scanning=true;frames=0;lastFrame=0;nativeDetector=null;if('BarcodeDetector' in window){try{nativeDetector=new BarcodeDetector({formats:['qr_code']});}catch(e){}}say('カメラ起動中。QRを枠内に映してください。');raf=requestAnimationFrame(frame);}catch(e){halt();say('カメラを起動できません（'+e.name+'）。Safariのサイト設定でカメラを「許可」にするか、写真読取をご利用ください。','warn');}});
stop.addEventListener('click',()=>{halt();say('カメラを停止しました。');});
document.getElementById('photo').addEventListener('click',()=>file.click());
file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;try{const bitmap=await createImageBitmap(f);const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();if(!decode())say('写真からQRを検出できませんでした。QRを大きく写して再度お試しください。','warn');}catch(e){say('画像を開けません: '+e.message,'warn');}file.value='';});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(result.textContent);say('読み取り結果をコピーしました。','success');}catch(e){say('コピーできませんでした。結果を長押ししてコピーしてください。','warn');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scanning){halt();say('画面を離れたためカメラを停止しました。');}});

 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const field=(name,val)=>{document.querySelector('#bridgeForm [name="'+name+'"]').value=val;};
 function request(op,payload){
  const url=document.getElementById('endpoint').value.trim(),secret=document.getElementById('secret').value.trim();
  if(!mode){say('先に受付モードを選んでください。','warn');return;}
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(url)){say('GASウェブアプリの /exec URLを入力してください。','warn');return;}
  if(!secret){say('受付担当者用の認証キーを入力してください。','warn');return;}
  if(inFlight){say('照合中です。少し待ってください。');return;}
  inFlight=true;const nonce=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();pending={nonce,op,payload};
  const form=document.getElementById('bridgeForm');form.action=url;
  field('nonce',nonce);field('secret',secret);field('op',op);field('mode',mode);field('payload',payload);
  say(op==='search'?'会員を検索中…':op==='accept'?'受付を確定中…':op==='stage'?'受信端末に送信中…':'会員情報を照合中…');
  form.submit();
  setTimeout(()=>{if(pending&&pending.nonce===nonce){inFlight=false;pending=null;say('応答がありません。GASの公開設定とdoPost接続を確認してください。','warn');}},18000);
 }
 window.addEventListener('message',event=>{
  if(!/^https:\/\/([a-z0-9-]+\.)?googleusercontent\.com$/.test(event.origin)&&event.origin!=='https://script.google.com')return;
  const msg=event.data;if(!msg||msg.type!=='hmt-qr-v22'||!pending||msg.nonce!==pending.nonce)return;
  const op=pending.op,checkedPayload=pending.payload;pending=null;inFlight=false;
  if(op==='search')showSearch(msg.data);else if(op==='accept')showAccepted(msg.data);else if(op==='stage'){say(msg.data?.ok?'受信端末へ送信しました。受信端末で確定してください。':msg.data?.message||'送信できませんでした',msg.data?.ok?'success':'warn');}else showCheck(msg.data,checkedPayload);
 });
 function showCheck(x,confirmedQr){
  if(!x||!x.ok){detail.innerHTML='<div class="notice bad"><b>'+esc(x?.title||'照合できません')+'</b><div>'+esc(x?.message||'')+'</div></div>';say(x?.message||'照合できませんでした','warn');return;}
  if(mode==='disaster'){
   const p=x.profile||{},family=x.family||[];
   detail.innerHTML='<div class="notice good"><b>🚨 災害時 会員確認</b><div><b>'+esc(x.memberName)+' 様</b></div><div>会員番号：'+esc(x.memberNo)+'</div><div>住所：'+esc(p.address||'未登録')+'</div><div>班：'+esc(p.group||'')+'</div><div>回覧元：'+esc(p.leaderName||'')+'</div><div>LINE会員氏名：'+esc(p.lineName||'')+'</div><b>家族情報</b><div>'+esc(family.join('・')||'登録なし')+'</div></div>';say('会員情報を確認しました。');return;
  }
  const a=(x.apps||[])[0];if(!a){detail.innerHTML='<div class="notice bad">対象の申込がありません</div>';return;}
  const name=esc(a.applicantName||a.memberName||x.memberName||'');
  if(a.already){detail.innerHTML='<div class="notice bad"><b>⚠️ 受付済み</b><div>'+name+' 様</div><div class="qty">'+esc(a.already.count||a.count)+'個</div><div>'+esc(a.already.time||'')+'</div></div>';say('すでに受付済みです。','warn');return;}
  detail.innerHTML='<div class="notice"><b>'+esc(a.name)+'</b><div>申込者：'+name+' 様</div><div>申込経路：'+esc(a.source||'')+'</div><div class="qty">'+esc(a.count)+'個</div><div class="notice good">📺 受信端末に送信します。受付確定は受信端末で行ってください。</div></div>';
  say('申込を確認しました。受信端末へ送信中…','success');request('stage',confirmedQr);
 }
 function showAccepted(x){detail.innerHTML='<div class="notice '+(x?.ok?'good':'bad')+'"><b>'+esc(x?.title||'受付結果')+'</b><div>'+esc(x?.memberName||'')+' 様</div><div class="qty">'+esc(x?.count||'')+(x?.count?'個':'')+'</div><div>'+esc(x?.message||'')+'</div></div>';say(x?.ok?'受付完了。次のQRを読み取れます。':x?.message||'受付できません',x?.ok?'success':'warn');}
 function showSearch(x){const target=document.getElementById('searchResults');if(!x?.ok){target.innerHTML='<p class="warn">'+esc(x?.message||'検索できません')+'</p>';return;}const arr=x.results||[];target.innerHTML=arr.length?arr.map((m,i)=>'<div class="item"><b>'+esc(m.memberName||'会員')+'</b><div class="small">'+esc(m.memberNo)+' / '+esc(m.address||'')+'</div><button class="btn alt" data-i="'+i+'">この会員を確認</button></div>').join(''):'該当する会員が見つかりません';target.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{lastQr='HMT_MEMBER:'+arr[Number(b.dataset.i)].memberNo;result.textContent=lastQr;request('check',lastQr);});}
 document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(v=>v.classList.toggle('selected',v===b));document.getElementById('chosen').textContent='選択中：'+b.textContent;document.getElementById('checkQr').disabled=false;detail.textContent='';}));
 document.getElementById('checkQr').onclick=()=>lastQr?request('check',lastQr):say('先にQRを読み取ってください。','warn');
 document.getElementById('search').onclick=()=>request('search',document.getElementById('manual').value.trim());
 document.getElementById('manual').addEventListener('keydown',e=>{if(e.key==='Enter')request('search',e.target.value.trim());});

})();
</script></body></html>
