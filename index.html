<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>浜田山町会 QRスキャナー</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#102441;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{max-width:660px;margin:0 auto;padding:20px 15px 45px}header{background:#102441;color:#fff;border-radius:18px;padding:22px}header small{color:#e6bc49;font-weight:800;letter-spacing:.1em}h1{font-size:23px;margin:7px 0 0}.card{background:white;border:1px solid #dae0e8;border-radius:16px;padding:18px;margin-top:14px}h2{font-size:18px;margin:0 0 12px}.btn{width:100%;border:0;border-radius:11px;padding:16px;margin:6px 0;font-size:17px;font-weight:800;cursor:pointer;background:#102441;color:#fff}.btn.alt{background:#eaf1f9;color:#102441}.btn.stop{background:#a72d43}.btn:disabled{opacity:.5}.muted{color:#617085;font-size:13px;line-height:1.65}.camera{position:relative;background:#101923;border-radius:12px;overflow:hidden;min-height:180px;display:none}.camera video{display:block;width:100%;max-height:430px;object-fit:cover}.camera:after{content:"";position:absolute;left:18%;right:18%;top:18%;bottom:18%;border:3px solid #e6bc49;border-radius:14px;pointer-events:none}#status{font-size:14px;line-height:1.7;white-space:pre-wrap}#result{word-break:break-all;font-weight:700;background:#f2f5fa;padding:12px;border-radius:10px;min-height:48px}input[type=file]{display:none}canvas{display:none}.warn{color:#a52b3c} .success{color:#176d43}</style></head>
<body><div class="wrap"><header><small>HAMADAYAMA TOWN ASSOCIATION</small><h1>浜田山町会 QRスキャナー</h1></header>
<section class="card"><h2>📷 QR連続読み取り</h2><p class="muted">Safariで開いてカメラの使用を許可してください。読み取った文字列のみをこの端末に表示します。</p><div class="camera" id="camera"><video id="video" autoplay muted playsinline></video></div><button class="btn" id="start">📷 カメラを起動</button><button class="btn stop" id="stop" hidden>■ カメラを停止</button><button class="btn alt" id="photo">📸 写真を撮影・選択して読み取る</button><input type="file" id="file" accept="image/*" capture="environment"><p id="status" aria-live="polite">待機中</p></section>
<section class="card"><h2>読み取り結果（動作確認用）</h2><div id="result">まだ読み取っていません</div><button class="btn alt" id="copy" disabled>結果をコピー</button><p class="muted">これはカメラの動作確認版です。会員情報の検索、イベント受付・引換登録、災害時の個人情報表示はまだ行いません。読み取った内容を外部へ送信・保存しません。</p></section>
<canvas id="canvas"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(()=>{'use strict';
const video=document.getElementById('video'),box=document.getElementById('camera'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),status=document.getElementById('status'),result=document.getElementById('result'),start=document.getElementById('start'),stop=document.getElementById('stop'),file=document.getElementById('file');
let stream=null,raf=0,last='',lastAt=0,scanning=false;
function say(s,kind=''){status.textContent=s;status.className=kind;}
function detected(s){const now=Date.now();if(s===last&&now-lastAt<2500)return;last=s;lastAt=now;result.textContent=s;document.getElementById('copy').disabled=false;say('QRを読み取りました。続けて次のQRを読み取れます。','success');if(navigator.vibrate)navigator.vibrate(100);}
function decode(){if(!window.jsQR){say('QR解析ライブラリを読み込めません。インターネット接続を確認してください。','warn');return false;}try{const found=window.jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(found){detected(found.data);return true;}}catch(e){say('画像解析に失敗しました: '+e.message,'warn');}return false;}
function frame(){if(!scanning)return;if(video.readyState>=2&&video.videoWidth){const scale=Math.min(1,960/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);ctx.drawImage(video,0,0,canvas.width,canvas.height);decode();}raf=requestAnimationFrame(frame);}
function halt(){scanning=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;box.style.display='none';start.hidden=false;stop.hidden=true;}
start.addEventListener('click',async()=>{if(!navigator.mediaDevices?.getUserMedia){say('このブラウザではカメラを利用できません。SafariのHTTPSページで開くか写真読取をご利用ください。','warn');return;}if(!window.jsQR){say('QR解析ライブラリを読み込めません。通信状態を確認してください。','warn');return;}try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();box.style.display='block';start.hidden=true;stop.hidden=false;scanning=true;say('カメラ起動中。QRを枠内に映してください。');frame();}catch(e){halt();say('カメラを起動できません（'+e.name+'）。Safariのサイト設定でカメラを「許可」にするか、写真読取をご利用ください。','warn');}});
stop.addEventListener('click',()=>{halt();say('カメラを停止しました。');});
document.getElementById('photo').addEventListener('click',()=>file.click());
file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;try{const bitmap=await createImageBitmap(f);const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();if(!decode())say('写真からQRを検出できませんでした。QRを大きく写して再度お試しください。','warn');}catch(e){say('画像を開けません: '+e.message,'warn');}file.value='';});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(result.textContent);say('読み取り結果をコピーしました。','success');}catch(e){say('コピーできませんでした。結果を長押ししてコピーしてください。','warn');}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scanning){halt();say('画面を離れたためカメラを停止しました。');}});
})();
</script></body></html>
